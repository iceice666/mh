[package]
name = "mh"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# ptc/runtime.rs is the deliberate FFI boundary.
unsafe_code = "allow"

[dependencies]
mh-quickjs-sys = { path = "../mh-quickjs-sys" }

ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
parking_lot = "0.12"
tempfile = "3"

[[bin]]
name = "mh"
path = "src/main.rs"
